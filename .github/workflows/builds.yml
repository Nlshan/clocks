name: Build FakeClock IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cat > project.yml <<'EOF'
          name: FakeClock

          options:
            xcodeVersion: "16.2"
            deploymentTarget:
              iOS: "17.0"

          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: 17.0

          targets:
            FakeClock:
              type: application
              platform: iOS

              sources:
                - path: FakeClock

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.fakeclock.app
                  PRODUCT_NAME: FakeClock
                  TARGETED_DEVICE_FAMILY: "1"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""

              info:
                path: FakeClock/Info.plist
                properties:
                  CFBundleDisplayName: Clock
                  CFBundleName: Clock
                  CFBundlePackageType: APPL
                  LSRequiresIPhoneOS: true
                  UILaunchScreen: {}
          EOF

          xcodegen generate

      - name: Check Project Format
        run: |
          grep -E "objectVersion|compatibilityVersion" FakeClock.xcodeproj/project.pbxproj || true

      - name: Build
        run: |
          rm -rf build

          xcodebuild \
            -project FakeClock.xcodeproj \
            -scheme FakeClock \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate App
        run: |
          find DerivedData -name "FakeClock.app" -type d

      - name: Package IPA
        run: |
          APP=$(find DerivedData -name "FakeClock.app" -type d | head -1)

          if [ -z "$APP" ]; then
            echo "FakeClock.app not found!"
            exit 1
          fi

          rm -rf Payload FakeClock.ipa
          mkdir Payload

          cp -R "$APP" Payload/FakeClock.app

          zip -r FakeClock.ipa Payload

          echo "IPA created:"
          ls -lh FakeClock.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FakeClock-IPA
          path: FakeClock.ipa
          if-no-files-found: error
